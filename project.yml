name: Richer
options:
  bundleIdPrefix: com.zuoxin
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.zuoxin.Richer
    MARKETING_VERSION: "0.2.5"
    CURRENT_PROJECT_VERSION: "7"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Richer/Resources/Info.plist
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES

targets:
  Richer:
    type: application
    platform: macOS
    sources:
      - path: Richer
        excludes:
          - "Resources/Info.plist"
    resources:
      - Richer/Resources/Assets.xcassets
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: Richer/Resources/Info.plist
      properties:
        CFBundleIconName: AppIcon
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSMicrophoneUsageDescription: "Richer needs microphone access for the input window's dictation button. Your audio is processed on-device by Apple's Speech framework and never leaves your Mac."
        NSSpeechRecognitionUsageDescription: "Richer uses Apple's on-device speech recognition to turn dictated speech into text. No audio is sent to external servers."
    settings:
      base:
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: Richer/Resources/Richer.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
